name: Release

# Push na `main`: com changesets pendentes, abre (ou atualiza) o PR de versão;
# sem eles, publica no npm o que ainda não está lá, por trusted publishing
# (OIDC, sem token guardado), com proveniência, e cria o release no GitHub de
# cada versão. A primeira versão de cada pacote precisa do nome reservado e da
# confiança configurada antes: `pnpm reservar:npm` (AGENTS.md, "Publicação").
#
# Actions fixadas por SHA (o comentário diz a versão); o Dependabot as atualiza.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Versão e publicação
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags, releases e a branch do PR de versão
      pull-requests: write # o PR de versão
      id-token: write # trusted publishing e proveniência
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # O changesets/action 2 empurra commit e tags pela API, com o token da
          # entrada `github-token`; o git do runner não precisa de credencial.
          persist-credentials: false

      # A versão do pnpm vem de `packageManager` no package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O pnpm 10 publica chamando o npm; o trusted publishing exige npm 11.5.1
      # ou mais novo. O `npm` das devDependencies é o que o `pnpm release` usa.
      - name: npm com suporte a trusted publishing
        run: |
          VERSAO=$(pnpm exec npm --version)
          if [ "$(printf '%s\n' "11.5.1" "$VERSAO" | sort -V | head -1)" != "11.5.1" ]; then
            echo "npm $VERSAO não publica por OIDC; precisa de 11.5.1 ou mais novo" >&2
            exit 1
          fi
          echo "npm $VERSAO"

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # `pnpm release` constrói, passa pelo portão de carga e publica.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          version-script: pnpm changeset version
          commit-message: "chore: versão dos pacotes"
          pr-title: "chore: versão dos pacotes"
