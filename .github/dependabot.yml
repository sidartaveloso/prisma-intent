# Atualizações de dependência. As do npm respeitam a quarentena do pnpm
# (`minimumReleaseAge`, 3 dias) no install do CI; as de segurança chegam fora
# do agrupamento, uma por PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
      producao:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
